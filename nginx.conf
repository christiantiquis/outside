server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://air-quality-api.open-meteo.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /health { access_log off; default_type text/plain; return 200 'ok\n'; }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
